name: pytest

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install . pytest
      - name: Report bounded runtime evidence
        continue-on-error: true
        run: python -m ouem.runtime_evidence
      - name: Run synthetic and unit tests
        run: python -m pytest -q -ra
