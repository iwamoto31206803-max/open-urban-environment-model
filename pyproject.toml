[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ouem"
version = "0.0.0"
description = "Open Urban Environment Model"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
ouem-plateau-buildings = "ouem.native.building.plateau:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
